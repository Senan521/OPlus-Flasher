name: OPlus Flasher Release

# Yeni sürüm yayınlamak için:  git tag v0.3.0 && git push origin v0.3.0
# (ya da Actions sekmesinden "Run workflow" ile bir etiket adı gir)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Sürüm etiketi (örn. v0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APKs
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    defaults:
      run:
        working-directory: LFA

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json src-tauri/tauri.conf.json
          echo "Sürüm: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install dependencies
        run: npm install

      - name: Initialize Android
        run: npm run tauri android init -- --ci

      - name: Apply Android customizations
        run: bash scripts/setup-android.sh

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('LFA/package.json', 'LFA/scripts/setup-android.sh') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        run: |
          for i in 1 2 3; do
            npm run tauri android build -- --debug --apk --target aarch64 --ci && exit 0
            echo "::warning::Derleme başarısız (deneme $i/3), 60 sn sonra tekrar denenecek"
            sleep 60
          done
          exit 1

      - name: Collect debug APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*debug*.apk' | head -n1)
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/dist/OPlus-Flasher-${TAG}-debug.apk"

      - name: Build release APK
        if: env.HAS_KEYSTORE == 'true'
        run: |
          for i in 1 2 3; do
            npm run tauri android build -- --apk --target aarch64 --ci && exit 0
            echo "::warning::Derleme başarısız (deneme $i/3), 60 sn sonra tekrar denenecek"
            sleep 60
          done
          exit 1

      - name: Sign release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT="$ANDROID_HOME/build-tools/35.0.0"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -path '*release*' -name '*.apk' | head -n1)
          test -n "$UNSIGNED"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$GITHUB_WORKSPACE/dist/OPlus-Flasher-${TAG}-release.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/dist/OPlus-Flasher-${TAG}-release.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Warn when release APK was skipped
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::KEYSTORE_BASE64 secret yok, imzalı release APK üretilmedi (yalnızca debug APK yayınlanır)."

      - name: Checksums
        run: |
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: OPlus Flasher ${{ env.TAG }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
